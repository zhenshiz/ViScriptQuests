
version = mod_version
group = mod_group_id

repositories {
    // Ponder / Flywheel
    maven {
        name = "Create"
        url = "https://maven.createmod.net"
        content {
            includeGroup "net.createmod.ponder"
            includeGroup "dev.engine-room.flywheel"
        }
    }
}

base {
    archivesName = "${mod_name}-neoforge-${minecraft_version}"
}

// mixinAgent 配置由根项目 build.gradle 的 subprojects 块统一提供，这里跳过它
configurations.matching { it.name != 'mixinAgent' }.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

// 本地测试模组。src/test 会被 git 忽略，方便放临时联动/演示代码。
def enableLocalTest = file('src/test').exists()
def localTestModId = "${mod_id}_test"

if (enableLocalTest) {
    sourceSets {
        localTest {
            java.srcDirs = ['src/test/java']
            resources.srcDirs = ['src/test/resources']
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
        }
    }
    sourceSets.test.java.setSrcDirs([])
    sourceSets.test.resources.setSrcDirs([])
}

// neoForge 的 version/parchment 由根项目 build.gradle 的 subprojects 块统一提供
neoForge {
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        if (enableLocalTest) {
            "${localTestModId}" {
                sourceSet(sourceSets.localTest)
            }
        }
    }
}

neoForge.unitTest {
    getTestedMod().set(neoForge.mods.named("${mod_id}"))
    enable()
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

apply from: project.file('gradle/ldlib2-uitest.gradle')

// modAccessor 由根项目 build.gradle 的 subprojects 块统一配置
dependencies {
    //前置模组
    implementation project(":ViScriptLib")
    jarJar project(path: ":ViScriptLib", configuration: "embeddedLibrary")
    implementation project(":ViScriptShop")
    implementation project(":ViScriptTeam")

    //精妙背包
    runtimeOnly "maven.modrinth:sophisticated-backpacks:${sophisticated_backpacks_version}"
    runtimeOnly "maven.modrinth:sophisticated-core:${sophisticated_core_version}"
    //超越维度
    runtimeOnly "curse.maven:beyond-dimensions-1222890:${beyonddimensions_version}"
    //chatbox
    implementation "curse.maven:chatbox-for-mc-1276866:8363433"

    implementation "curse.maven:xaeros-minimap-263420:${xaeros_minimap_version}"
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description,
                             ldlib2_version         : ldlib2_version]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            groupId = project.group
            artifactId = base.archivesName.get()
            version = project.version

            pom.withXml {
                def dependenciesNode = asNode().getAt("dependencies")[0]
                if (dependenciesNode != null) {
                    // 这里添加你希望保留在 POM 中的 groupId 或 artifactId，也就是从 Maven 拉依赖时会附带的库、模组啥的
                    def whiteList = [
                    ]

                    def dependencies = dependenciesNode.children()
                    def toRemove = []

                    dependencies.each { dep ->
                        def artifactId = dep.artifactId.text()
                        def groupId = dep.groupId.text()

                        if (!whiteList.contains(artifactId) && !whiteList.contains(groupId)) {
                            toRemove.add(dep)
                        }
                    }

                    toRemove.each { dependenciesNode.remove(it) }
                }
            }
        }
    }

    repositories {
        def modVersion = project.findProperty('mod_version') ?: 'unknown'

        boolean isSnapshot = modVersion.toLowerCase().contains('snapshot')

        def publishUrl = isSnapshot ?
                "https://maven.sighs.cc/repository/maven-snapshots/" :
                "https://maven.sighs.cc/repository/maven-releases/"

        // 优先环境变量，其次根项目 publish.env（由 gradle/publish-conventions.gradle 解析）
        def publishUser = System.getenv("SIGHS_PUBLISH_USER") ?: project.findProperty('publishEnv')?.get('SIGHS_PUBLISH_USER')
        def publishPassword = System.getenv("SIGHS_PUBLISH_PASSWORD") ?: project.findProperty('publishEnv')?.get('SIGHS_PUBLISH_PASSWORD')

        maven {
            name = "remoteRepo"
            url = uri(publishUrl)
            credentials {
                username = publishUser
                password = publishPassword
            }
        }
    }
}
